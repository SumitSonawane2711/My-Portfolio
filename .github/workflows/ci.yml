name: CI

# Full checks run once per change, on dev:
#   push to dev         → full pipeline (the "ci" check on the commit)
#   pull request → dev  → full pipeline (e.g. from a feature branch)
# Pull requests dev → main don't repeat any of this: the head commit already
# carries a passing "ci" check from its push to dev. They only run the quick
# release check in pr-main.yml, and Vercel builds production after the merge.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

# Cancel an in-progress run when a newer commit lands on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # A separate Neon branch just for CI (repository secrets, never the
      # production database). Public pages read the database at build time,
      # so the build needs a real, migrated database.
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.CI_DATABASE_URL_UNPOOLED }}
      # CI never logs in, uploads or sends mail, so other secrets are skipped.
      SKIP_ENV_VALIDATION: "true"
      # Better Auth refuses its default secret in production builds; these are
      # placeholders only (no real sessions exist in CI).
      BETTER_AUTH_SECRET: ci-dummy-secret-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      # Silences "Social provider github is missing clientId" during the build.
      GITHUB_CLIENT_ID: ci-placeholder
      GITHUB_CLIENT_SECRET: ci-placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: demo
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Also runs `prisma generate` through the postinstall script.
      - name: Install dependencies
        run: npm ci

      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        run: >-
          npx commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Fail in seconds with a clear message instead of a confusing build error.
      - name: Check CI database secrets
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::error::Repository secrets CI_DATABASE_URL and CI_DATABASE_URL_UNPOOLED are not set (Settings → Secrets and variables → Actions). The build reads the database."
            exit 1
          fi

      # Neon suspends the idle CI branch; the first connection has to wake its
      # compute, which can outlast Prisma's default connect timeout (P1001
      # "Can't reach database server"). Give it 30 s and retry with backoff.
      - name: Apply migrations to the CI database
        run: |
          export DATABASE_URL_UNPOOLED="$(node -e 'const u = new URL(process.env.DATABASE_URL_UNPOOLED.trim()); u.searchParams.set("connect_timeout", "30"); process.stdout.write(u.toString())')"
          for attempt in 1 2 3 4; do
            npx prisma migrate deploy && exit 0
            echo "::warning::Database not reachable yet (attempt $attempt of 4); retrying in $((attempt * 10)) s"
            sleep $((attempt * 10))
          done
          echo "::error::Could not reach the CI database. Check the CI_DATABASE_URL* secrets and that the Neon branch exists."
          exit 1

      # Reuses Next.js build output from earlier runs → faster rebuilds.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts', 'prisma/schema.prisma') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        timeout-minutes: 10
        run: npm run build
