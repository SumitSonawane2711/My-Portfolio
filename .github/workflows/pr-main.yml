name: Release check

# Pull requests into main (production). Deliberately light: lint, tests and the
# build already ran for this exact commit on its push to dev (the "ci" check,
# which the main ruleset requires), and Vercel builds production after merge.
on:
  pull_request:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Only dev can be merged into main
        if: github.head_ref != 'dev'
        run: |
          echo "::error::Pull requests into main must come from dev (this one is from '${{ github.head_ref }}'). Merge your branch into dev first."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint commit messages
        run: >-
          npx commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
